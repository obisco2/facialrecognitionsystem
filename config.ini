[Paths]
KNOWN_FACES_DIR = data/known_faces
TRAINING_DIR = data/training
ATTENDANCE_DIR = data/attendance
MODELS_DIR = models

[Database]
DB_PATH = data/users.db

[Camera]
CAMERA_INDEX = 0
FRAME_SCALE = 0.25
FRAME_WIDTH = 640
FRAME_HEIGHT = 480
; Leave STREAM_URL blank to use local webcam (CAMERA_INDEX).
; Set to an RTSP/HTTP URL for IP camera, e.g. rtsp://192.168.1.100:554/stream
STREAM_URL =

[Recognition]
TOLERANCE = 0.6
MODEL = hog
; ENGINE: auto (dlib if installed, LBPH fallback), dlib, lbph
ENGINE = auto
NUMBER_OF_SAMPLES = 100
FACE_PADDING = 20
MIN_ENROLLMENT_PHOTOS = 5

[Attendance]
SESSION_TIMEOUT = 60
DUPLICATE_PREVENTION = true
EXPORT_FORMAT = csv

[Security]
ADMIN_PASSWORD = admin

[UI]
THEME = dark
APP_NAME = AttendIQ

[Logging]
LEVEL = INFO
FILE = face_recog.log
