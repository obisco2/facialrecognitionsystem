<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendIQ — Facial Recognition Attendance System</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="lucide.min.js?v=2"></script>
    <!-- ChartJS -->
    <script src="chart.js?v=2"></script>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body class="dark-theme">
    <div id="toast-container" class="toast-container"></div>

    <!-- --- Login Screen --- -->
    <div id="login-screen" class="login-screen">
        <div class="login-card glass">
            <div class="login-header">
                <div class="logo">
                    <i data-lucide="scan-face" class="accent-color"></i>
                    <h2>Attend<span>IQ</span></h2>
                </div>
                <p>Sign in to your account</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i data-lucide="user"></i>
                        <input type="text" id="username" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn primary-btn btn-full">
                    <span>Sign In</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </form>
            <div style="margin-top: 24px; text-align: center; font-size: 0.75rem; color: var(--text-secondary); border-top: 1px dashed var(--border-color); padding-top: 16px; line-height: 1.4;">
                <p style="font-weight: 700; color: var(--text-primary); letter-spacing: 0.5px;">UNIVERSITY OF LAGOS</p>
                <p style="font-size: 0.7rem; text-transform: uppercase;">Department of Computer Engineering</p>
                <p style="margin-top: 8px;"><strong>Author:</strong> Obitade Oladayo (Matric: 210408502)</p>
                <p><strong>Supervisor:</strong> Engr. Muhammad Hisham</p>
            </div>
        </div>
    </div>

    <!-- --- Main Dashboard Shell --- -->
    <div id="dashboard-shell" class="dashboard-shell hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i data-lucide="scan-face" class="accent-color"></i>
                    <h2>Attend<span>IQ</span></h2>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul id="nav-list">
                    <!-- Nav items injected dynamically based on user role -->
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">
                        <i data-lucide="user"></i>
                    </div>
                    <div class="user-details">
                        <h4 id="user-display-name">Loading...</h4>
                        <span id="user-display-role">student</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn ghost-btn btn-icon" title="Log out">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="page-title">Dashboard</h1>
                <div class="header-actions">
                    <span class="status-badge live-badge hidden" id="system-status">
                        <span class="pulse"></span> Live Session
                    </span>
                </div>
            </header>

            <div id="tab-content" class="tab-content">
                <!-- Content gets loaded dynamically here based on active tab -->
            </div>
        </main>
    </div>

    <!-- --- Modal Dialogs --- -->
    <div id="modal-container" class="modal-overlay hidden">
        <div class="modal-card glass">
            <div class="modal-header">
                <h3 id="modal-title">Modal Title</h3>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Modal content injected dynamically -->
            </div>
        </div>
    </div>
    <!-- Mock API: auto-loads when served as static site (no backend) -->
    <script>
    (function() {
        // If served from localhost, assume backend is running. Otherwise load mock.
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            document.write('<script src="mock-api.js"><\/script>');
            console.log('%c[AttendIQ] DEMO mode — mock API active (no backend)', 'color: #e94560; font-weight: bold');
        }
    })();
    </script>
    <script src="app.js?v=2"></script>
</body>
</html>
