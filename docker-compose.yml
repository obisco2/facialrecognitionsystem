version: "3.8"

services:
  attendiq:
    build: .
    container_name: attendiq-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.ini:/app/config.ini
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
