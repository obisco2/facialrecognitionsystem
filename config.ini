[Paths]
known_faces_dir = data/known_faces
training_dir = data/training
attendance_dir = data/attendance
models_dir = models

[Database]
db_path = data/users.db

[Camera]
camera_index = 0
frame_scale = 0.25
frame_width = 640
frame_height = 480
stream_url = 

[Recognition]
tolerance = 0.6
model = hog
engine = auto
number_of_samples = 100
face_padding = 20
min_enrollment_photos = 5

[Attendance]
session_timeout = 60
duplicate_prevention = true
export_format = csv

[Security]
admin_password = admin

[UI]
theme = dark
app_name = AttendIQ

[Logging]
level = INFO
file = face_recog.log

[TestSection]
testkey = test_value

